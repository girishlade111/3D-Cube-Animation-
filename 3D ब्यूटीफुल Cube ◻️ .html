<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish 3D Cube Animation</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        h1 {
            position: absolute;
            top: 20px;
            color: #ffffff;
            font-size: 28px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* Scene for Perspective */
        .scene {
            width: 300px;
            height: 300px;
            perspective: 1200px; /* Depth effect */
        }

        /* Cube Styling */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d; /* Maintain 3D effect */
            animation: rotateCube 10s infinite ease-in-out; /* Smooth rotation */
        }

        /* Cube Faces */
        .cube div {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 15px; /* Rounded corners */
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.6); /* Shadow effect */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            transition: transform 0.5s; /* Smooth transition for hover effects */
        }

        .front { background-image: linear-gradient(45deg, #ff5733, #ffcc33); transform: translateZ(150px); }
        .back { background-image: linear-gradient(45deg, #33c1ff, #75ff33); transform: rotateY(180deg) translateZ(150px); }
        .right { background-image: linear-gradient(45deg, #ff33a1, #8c33ff); transform: rotateY(90deg) translateZ(150px); }
        .left { background-image: linear-gradient(45deg, #ffcc33, #33c1ff); transform: rotateY(-90deg) translateZ(150px); }
        .top { background-image: linear-gradient(45deg, #75ff33, #ff5733); transform: rotateX(90deg) translateZ(150px); }
        .bottom { background-image: linear-gradient(45deg, #8c33ff, #ffcc33); transform: rotateX(-90deg) translateZ(150px); }

        /* Animation for Cube Rotation */
        @keyframes rotateCube {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* Hover Effects */
        .cube div:hover {
            transform: scale(1.1);
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .scene {
                width: 200px;
                height: 200px;
                perspective: 800px; /* Adjust perspective for smaller screens */
            }

            .cube div {
                width: 200px;
                height: 200px;
                font-size: 18px; /* Smaller text size */
            }
        }
    </style>
</head>
<body>
    <h1>Stylish Rotating Cube</h1>
    <div class="scene">
        <div class="cube">
            <div class="front">Front</div>
            <div class="back">Back</div>
            <div class="right">Right</div>
            <div class="left">Left</div>
            <div class="top">Top</div>
            <div class="bottom">Bottom</div>
        </div>
    </div>

    <script>
        // Optional Interactive Controls
        const cube = document.querySelector('.cube');
        
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (event) => {
          const x = (event.clientX / window.innerWidth - 0.5) * -2; // Normalize X
          const y = (event.clientY / window.innerHeight - 0.5) * -2; // Normalize Y
          
          cube.style.transform = `rotateX(${mouseY + y * 30}deg) rotateY(${mouseX + x * -30}deg)`; // Interactive rotation
          mouseX += x * -2; 
          mouseY += y * -2; 
      });
    </script>
</body>
</html>
